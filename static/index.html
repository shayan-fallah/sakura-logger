<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sakura Log</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Nunito:wght@400;600;700;800;900&family=Vazirmatn:wght@400;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="wallpaper"></div>
<div id="sky"></div>

<div id="login" class="login-wrap" hidden>
  <form class="card login" id="login-form">
    <div id="login-mascot"></div>
    <h1>Okaeri, senpai~</h1>
    <p>おかえりなさい ✿ welcome back</p>
    <input class="input" type="password" id="login-pw" placeholder="Password" autocomplete="current-password" required>
    <div style="height:12px"></div>
    <button class="btn primary" style="width:100%">Let me in ♡</button>
    <p class="err" id="login-err"></p>
  </form>
</div>

<div id="main" class="shell" hidden>
  <header class="top">
    <div class="brand">
      <span class="logo">🌸</span>
      <div><h1>Sakura Log</h1><small>桜 · TIME &amp; WORK</small></div>
    </div>
    <span class="today-chip" id="today-chip"></span>
    <nav class="tabs" id="tabs">
      <button data-view="timer">⏱ Timer</button>
      <button data-view="projects">❀ Projects</button>
      <button data-view="calendar">🗓 Calendar</button>
      <button data-view="reports">✦ Reports</button>
      <button data-view="settings">⚙ Settings</button>
    </nav>
  </header>
  <main id="view"></main>
</div>

<div class="toasts" id="toasts"></div>
<script src="jalali.js"></script>
<script src="app.js"></script>
</body>
</html>
